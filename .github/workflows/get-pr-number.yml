name: Get PR number
on:
  workflow_call:
    outputs:
      PR_NUMBER:
        description: "The extracted PR number"
        value: ${{ jobs.get-pr-number.outputs.PR_NUMBER }}

permissions: {}

jobs:
  get-pr-number:
    permissions: {}
    runs-on: ubuntu-22.04
    name: Get PR number
    outputs:
      PR_NUMBER: ${{ steps.set_pr_number.outputs.PR_NUMBER }}
    steps:
      - name: Get PR number
        shell: bash
        run: |
          if [[ "${{ github.event.issue.number }}" != "" && "${GITHUB_EVENT_ISSUE_PULL_REQUEST}" != "" ]]; then
            echo "PR_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.pull_request.number }}" != "" ]]; then
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          elif [[ "${GITHUB_EVENT_PULL_REQUEST}" != "" ]]; then
            echo "PR_NUMBER=${{ github.event.number }}" >> $GITHUB_ENV
          else
            echo "PR_NUMBER=" >> $GITHUB_ENV
          fi
        env:
          GITHUB_EVENT_ISSUE_PULL_REQUEST: ${{ github.event.issue.pull_request }}
          GITHUB_EVENT_PULL_REQUEST: ${{ github.event.pull_request }}

      - name: Check PR number
        shell: bash
        run: |
          echo "${PR_NUMBER}"

      - name: Set PR number
        id: set_pr_number
        run: echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
